<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이화여고 단어장 · 하드모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1912;
    --bg-card:#252217;
    --line:#3E3826;
    --ink:#EDE6D6;
    --ink-soft:#B4AB94;
    --gold:#C98A1A;
    --gold-pale:#3A2E12;
    --green:#4F9D69;
    --green-pale:#1D3323;
    --coral:#D9694A;
    --coral-pale:#3B2018;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);}
  #app{max-width:640px;margin:0 auto;padding:18px 16px 60px;}

  .eyebrow{font-family:'Gowun Batang',serif;font-size:13px;color:var(--gold);}
  h1{font-family:'Gowun Batang',serif;font-size:23px;line-height:1.35;margin:2px 0 4px;font-weight:700;color:var(--ink);}
  .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin-bottom:16px;}

  .day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .day-card{
    background:var(--bg-card);border:1.5px solid var(--line);border-radius:6px;
    padding:10px 6px 8px;text-align:center;cursor:pointer;
  }
  .day-card:active{transform:scale(0.96);}
  .day-card .dnum{font-family:'Gowun Batang',serif;font-size:16px;font-weight:700;}
  .day-card .drange{font-size:9.5px;color:var(--ink-soft);margin-top:1px;}
  .day-card .dscore{font-size:10.5px;margin-top:5px;font-weight:700;color:var(--ink-soft);}
  .day-card.mastered{border-color:var(--green);background:var(--green-pale);}
  .day-card.mastered .dscore{color:var(--green);}
  .day-card.attempted{border-color:var(--gold);background:var(--gold-pale);}
  .day-card.attempted .dscore{color:var(--gold);}

  .btn{
    display:inline-block;width:100%;text-align:center;font-weight:700;font-size:15px;
    padding:13px 16px;border-radius:8px;border:none;cursor:pointer;
  }
  .btn-primary{background:var(--gold);color:#1B1912;}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  .word-row{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .word-row:last-child{border-bottom:none;}
  .word-en{font-family:'Gowun Batang',serif;font-weight:700;font-size:15px;min-width:110px;}
  .word-no{color:var(--ink-soft);font-size:11px;margin-right:6px;}
  .word-ko{font-size:13px;color:var(--ink-soft);text-align:right;line-height:1.5;flex:1;}

  .quiz-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .quiz-top .qcount{font-size:12.5px;color:var(--ink-soft);}
  .quiz-top .qscore{font-size:12.5px;color:var(--gold);font-weight:700;}
  .progress-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .2s ease;}

  .qtype{display:inline-block;font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:3px 10px;margin-bottom:10px;}

  .prompt-card{
    background:var(--bg-card);border:1.5px solid var(--line);border-radius:10px;
    padding:26px 18px;text-align:center;margin-bottom:14px;min-height:80px;
    display:flex;align-items:center;justify-content:center;
  }
  .prompt-en{font-family:'Gowun Batang',serif;font-size:25px;font-weight:700;}
  .prompt-ko{font-size:15.5px;line-height:1.6;font-weight:500;}

  .spell-input{
    width:100%;padding:14px;font-size:18px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--bg-card);color:var(--ink);font-family:'Noto Sans KR',sans-serif;
    text-align:center;letter-spacing:0.02em;
  }
  .spell-input:focus{outline:none;border-color:var(--gold);}
  .spell-input.correct{border-color:var(--green);color:var(--green);}
  .spell-input.wrong{border-color:var(--coral);color:var(--coral);}
  .answer-reveal{text-align:center;margin-top:10px;font-size:13.5px;color:var(--ink-soft);}
  .answer-reveal b{color:var(--green);font-family:'Gowun Batang',serif;}

  .check-opt{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-card);
    border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;
    font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.5;
  }
  .check-opt .box{width:18px;height:18px;flex:0 0 18px;border-radius:5px;border:1.5px solid var(--ink-soft);margin-top:1px;position:relative;}
  .check-opt.picked .box{background:var(--gold);border-color:var(--gold);}
  .check-opt.picked .box::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#1B1912;font-weight:900;}
  .check-opt.correct{border-color:var(--green);background:var(--green-pale);}
  .check-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
  .check-opt.missed{border-color:var(--gold);}

  .tip-box{background:var(--gold-pale);border:1.5px dashed var(--gold);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.6;color:var(--ink);margin:12px 0 4px;}
  .tip-box b{color:var(--gold);}

  .result-num{font-family:'Gowun Batang',serif;font-size:44px;text-align:center;font-weight:700;margin:6px 0 2px;color:var(--gold);}
  .result-label{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .miss-title{font-size:13px;font-weight:700;color:var(--coral);margin:14px 0 6px;}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .back{font-size:13px;color:var(--ink-soft);cursor:pointer;padding:4px 0;}
  .plan-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6;}
</style>
</head>

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function dayStatus(d){ const rec=PROGRESS.days[d]; if(!rec) return 'fresh'; if(rec.best>=16) return 'mastered'; return 'attempted'; }
function senses(word){ return word.ko.split(';').map(s=>s.trim()).filter(Boolean); }

/* ---------------- QUESTION BUILDERS ---------------- */
function buildSpellQ(word){
  const ci = clusterMap[word.en];
  return { type:'spell', word, tip: ci!==undefined ? CLUSTERS[ci].tip : null };
}
function buildMultiQ(word, poolWords){
  const correct = senses(word);
  let decoyPool = poolWords.filter(w=>w.en!==word.en).flatMap(w=>senses(w));
  decoyPool = decoyPool.filter(s=>!correct.includes(s));
  const decoyCount = Math.max(2, Math.min(4, 6-correct.length));
  const decoys = sample(decoyPool, decoyCount);
  const options = shuffle(correct.map(s=>({text:s,ok:true})).concat(decoys.map(s=>({text:s,ok:false}))));
  return { type:'multi', word, options };
}
function makeQuestion(word, dayWords){
  const r = Math.random();
  if(r<0.68) return buildSpellQ(word);
  return buildMultiQ(word, dayWords);
}

function buildQuiz(day){
  const newWords = shuffle(DAYS[day]);
  let extras=[];
  if(day>1){
    const prevPool=[];
    for(let d=1; d<day; d++){
      const wrongNos=(PROGRESS.days[d]&&PROGRESS.days[d].wrongNos)||[];
      wrongNos.forEach(no=>{const w=WORDS.find(x=>x.no===no); if(w) prevPool.push(w);});
    }
    const source = prevPool.length? prevPool : DAYS.slice(1,day).flat();
    extras = sample(source, Math.min(2, source.length));
  } else { extras = sample(newWords,2); }
  const all = newWords.concat(extras).slice(0,20);
  while(all.length<20){ all.push(sample(newWords,1)[0]); }
  return all.map(w=>makeQuestion(w, DAYS[day]));
}
function buildReviewQuiz(){
  const attemptedDays = Object.keys(PROGRESS.days).map(Number);
  let pool=[];
  attemptedDays.forEach(d=>{
    const wrongNos=(PROGRESS.days[d]&&PROGRESS.days[d].wrongNos)||[];
    wrongNos.forEach(no=>{const w=WORDS.find(x=>x.no===no); if(w) pool.push(w);});
  });
  if(pool.length<20){
    const learned = attemptedDays.flatMap(d=>DAYS[d]);
    const exclude = new Set(pool.map(w=>w.no));
    pool = pool.concat(sample(learned.filter(w=>!exclude.has(w.no)), 20-pool.length));
  }
  if(pool.length===0) pool = sample(WORDS,20);
  const chosen = sample(pool, Math.min(20,pool.length));
  while(chosen.length<20) chosen.push(sample(WORDS,1)[0]);
  const allWords = WORDS;
  return chosen.map(w=>makeQuestion(w, allWords));
}

  if(state.view==='quiz') return renderQuiz();
  if(state.view==='result') return renderResult();
}

function renderHome(){
  const totalMastered = Object.keys(PROGRESS.days).filter(d=>dayStatus(d)==='mastered').length;
  let grid='';
  for(let d=1; d<=NUM_DAYS; d++){
    const rec=PROGRESS.days[d]; const st=dayStatus(d);
    const range=`${(d-1)*18+1}-${d*18}`;
    const scoreLabel = rec ? `${rec.best}/20` : '학습 전';
    grid += `<div class="day-card ${st}" onclick="goDay(${d})">
      <div class="dnum">Day ${d}</div><div class="drange">${range}번</div><div class="dscore">${scoreLabel}</div>
    </div>`;
  }
  app.innerHTML = `
    <div class="eyebrow">이화여고 단어장 · 하드모드</div>
    <h1>스펠링 직접 입력 + 다의어 전체 선택</h1>
    <div class="sub">이번엔 객관식 찍기가 안 통해요. 뜻을 보고 영단어 스펠링을 직접 입력하거나, 뜻이 여러 개인 단어는 <b>맞는 뜻을 빠짐없이 전부</b> 골라야 정답이에요. 마스터 기준은 16/20점. 지금까지 <b>${totalMastered}/20일</b> 마스터했어요.</div>
    <div class="day-grid">${grid}</div>
    <button class="btn btn-ghost" onclick="goReview()">전체 복습 퀴즈 (틀렸던 단어 위주 20문제)</button>
    <div class="plan-note">스펠링은 대소문자 상관없지만 정확히 입력해야 정답 처리돼요. 다의어 문제는 체크박스로 여러 개를 고를 수 있어요.</div>
  `;
}

function renderDayList(){
  const d=state.day; const words=DAYS[d];
  const rows = words.map(w=>`<div class="word-row"><div class="word-en"><span class="word-no">${w.no}</span>${w.en}</div><div class="word-ko">${w.ko}</div></div>`).join('');
  app.innerHTML = `
    <div class="topbar"><span class="back" onclick="goHome()">← 목록</span></div>
    <div class="eyebrow">Day ${d} · ${(d-1)*18+1}~${d*18}번</div>
    <h1>오늘의 단어 18개</h1>
    <div class="sub">뜻을 전부 외운 뒤 시작하세요 — 다의어는 모든 뜻이 다 시험에 나올 수 있어요.</div>
    <div style="border:1.5px solid var(--line);border-radius:10px;background:var(--bg-card);padding:4px 12px;margin-bottom:14px;">${rows}</div>
    <button class="btn btn-primary" onclick="startQuiz(${d})">하드모드 퀴즈 시작 (20문제)</button>
  `;
}

function renderQuiz(){
  const q = state.quiz[state.qi];
  const pct = Math.round((state.qi/state.quiz.length)*100);
  let body='';
  if(q.type==='spell'){
    const cls = state.answered ? (state.correct? 'correct':'wrong') : '';
    body = `
      <div class="qtype">주관식 · 스펠링 입력</div>
      <div class="prompt-card"><div class="prompt-ko">${q.word.ko}</div></div>
      <input class="spell-input ${cls}" id="spellInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
        placeholder="영단어를 입력하세요" value="${state.typed.replace(/"/g,'&quot;')}"
        ${state.answered?'disabled':''} onkeydown="if(event.key==='Enter') submitSpell();">
      ${state.answered ? `<div class="answer-reveal">정답: <b>${q.word.en}</b></div>` : ''}
    `;
  } else {
    body = `
      <div class="qtype">다의어 · 맞는 뜻 전부 고르기</div>
      <div class="prompt-card"><div class="prompt-en">${q.word.en}</div></div>
      ${q.options.map((o,idx)=>{
        let cls='check-opt'+(state.picked.has(idx)?' picked':'');
        if(state.answered){
          if(o.ok && state.picked.has(idx)) cls+=' correct';
          else if(!o.ok && state.picked.has(idx)) cls+=' wrong';
          else if(o.ok && !state.picked.has(idx)) cls+=' missed';
        }
        return `<div class="${cls}" onclick="${state.answered?'':'toggleOpt('+idx+')'}"><div class="box"></div><div>${o.text}</div></div>`;
      }).join('')}
      ${!state.answered ? `<button class="btn btn-primary" onclick="submitMulti()">확인</button>` : ''}
    `;
  }
  let tipHtml='';
  if(state.answered && q.tip){ tipHtml = `<div class="tip-box">${q.tip}</div>`; }
  app.innerHTML = `
    <div class="topbar"><span class="back" onclick="goHome()">← 그만하기</span></div>
    <div class="quiz-top"><span class="qcount">Day ${state.day||'복습'} · 문제 ${state.qi+1}/${state.quiz.length}</span><span class="qscore">맞은 개수 ${state.score}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${body}
    ${tipHtml}
    ${state.answered ? `<button class="btn btn-primary" style="margin-top:12px" onclick="nextQuestion()">${state.qi+1<state.quiz.length?'다음 문제':'결과 보기'}</button>` : ''}
  `;
  if(q.type==='spell' && !state.answered){
    const inp = document.getElementById('spellInput');
    if(inp){ inp.focus(); inp.oninput = e=>{ state.typed = e.target.value; }; }
  }
}

function renderResult(){
  const total = state.quiz.length;
  const missHtml = state.wrong.length ? `
    <div class="miss-title">틀린 단어 ${state.wrong.length}개</div>
    <div style="border:1.5px solid var(--line);border-radius:10px;background:var(--bg-card);padding:4px 12px;">
      ${state.wrong.map(w=>`<div class="word-row"><div class="word-en">${w.en}</div><div class="word-ko">${w.ko}</div></div>`).join('')}
    </div>` : `<div class="sub" style="text-align:center;">틀린 단어가 없어요, 완벽해요!</div>`;
  app.innerHTML = `
    <div class="eyebrow">${state.day ? 'Day '+state.day+' 결과 (하드모드)' : '전체 복습 결과'}</div>
    <div class="result-num">${state.score} / ${total}</div>
    <div class="result-label">${state.score>=16?'하드모드까지 완벽해요!':state.score>=11?'좋아요, 조금만 더 반복하면 완벽해요.':'하드모드는 원래 어려워요. 기본 모드로 한 번 더 복습해도 좋아요.'}</div>
    ${missHtml}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goHome()">홈으로</button>
      <button class="btn btn-primary" onclick="${state.day?`startQuiz(${state.day})`:'goReview()'}">다시 풀기</button>
    </div>
  `;
}

/* ---------------- ACTIONS ---------------- */
function goHome(){ state.view='home'; render(); }
function goDay(d){ state.day=d; state.view='daylist'; render(); }
function goReview(){
  state.day=null; state.quiz=buildReviewQuiz(); state.qi=0; state.score=0; state.wrong=[]; state.answered=false; state.picked=new Set(); state.typed='';
  state.view='quiz'; render();
}
function startQuiz(d){
  state.day=d; state.quiz=buildQuiz(d); state.qi=0; state.score=0; state.wrong=[]; state.answered=false; state.picked=new Set(); state.typed='';
  state.view='quiz'; render();
}
function normalize(s){ return s.trim().toLowerCase(); }
function submitSpell(){
  if(state.answered) return;
  const q = state.quiz[state.qi];
  const ok = normalize(state.typed)===normalize(q.word.en);
  state.answered=true; state.correct=ok;
  if(ok) state.score++; else state.wrong.push(q.word);
  render();
}
function toggleOpt(idx){
  if(state.picked.has(idx)) state.picked.delete(idx); else state.picked.add(idx);
  render();
}
function submitMulti(){
  const q = state.quiz[state.qi];
  const allCorrectPicked = q.options.every((o,idx)=> o.ok === state.picked.has(idx));
  state.answered=true; state.correct=allCorrectPicked;
  if(allCorrectPicked) state.score++; else state.wrong.push(q.word);
  render();
}
function nextQuestion(){
  if(state.qi+1 < state.quiz.length){
    state.qi++; state.answered=false; state.picked=new Set(); state.typed=''; render();
  } else { finishQuiz(); }
}
function finishQuiz(){
  if(state.day){
    const d=state.day; const prevBest=(PROGRESS.days[d]&&PROGRESS.days[d].best)||0;
    PROGRESS.days[d] = { best: Math.max(prevBest, state.score), last: state.score, wrongNos: state.wrong.map(w=>w.no) };
    saveProgress();
  }
  state.view='result'; render();
}

window.goHome=goHome; window.goDay=goDay; window.goReview=goReview; window.startQuiz=startQuiz;
window.submitSpell=submitSpell; window.toggleOpt=toggleOpt; window.submitMulti=submitMulti; window.nextQuestion=nextQuestion;

(function init(){ loadProgress(); render(); })();
</script>
</body>
</html>
